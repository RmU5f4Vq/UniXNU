name: Build sheng boot image

# Produces flashable artifacts for the Xiaomi Pad 6S Pro (sheng, SM8550).
# Upstream's "macOS build" workflow stops after the payload and publishes only
# redacted logs. This one continues through package, firmware and bootimg, and
# uploads the images, so a fork boots without a local Mac.
#
# Pinned sources, declared once here instead of retyped per run:
#   * Apple restore image  updates.cdn-apple.com (HTTP Range; the 12 GiB zip is never downloaded whole)
#   * Xiaomi vendor archive  MIUI OTA bucket on Aliyun OSS (MD5-gated in extract-sheng-firmware.py)
#   * mainline DTS   pinned commit of ianchb/sm8550-mainline
#
# Required repository secret:
#   UNIXNU_UNIQUE_CHIP_ID  platform seed for the ADT; board.toml marks it "required"

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name (empty uses this fork's UniXNU-sheng)
        required: false
        default: ''
      device_ref:
        description: Device repository ref
        required: true
        default: main
      uefi_repository:
        description: Mu-Silicium firmware repository as owner/name
        required: true
        default: UniXNU/uefi-sheng
      uefi_ref:
        description: Firmware repository ref
        required: true
        default: sheng
      xcode:
        description: Xcode version of the macos-26 image
        required: true
        default: '26.6'
      ipsw_url:
        description: IPSW URL (empty uses the pinned iPadOS 17.7.11 restore image)
        required: false
        default: ''
      trust_cache_url:
        description: Trust cache bundle URL (optional; masked in the logs)
        required: false
        default: ''
      owner_trust_cache:
        description: Treat the trust cache URL as an owner-signed bundle
        type: boolean
        default: false
      data_seed_url:
        description: Data seed URL (optional; masked in the logs)
        required: false
        default: ''
      skip_setup:
        description: Mark Setup as done in the Data seed
        type: boolean
        default: false
      skip_preflight:
        description: Skip the board preflight check in the firmware step
        type: boolean
        default: false
      snapshot_url:
        description: Qualification snapshot URL (zip of build/ artifacts the kernel archives need)
        required: false
        default: ''
      allow_missing_snapshot:
        description: Continue without the qualification artifacts instead of stopping
        type: boolean
        default: false
      publish_release:
        description: Publish the images to a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sheng-image-${{ github.ref }}-${{ inputs.device_ref }}-${{ inputs.uefi_ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

  # Apple restore image. cli_ipsw.py reads the zip directory and each needed
  # member with HTTP range requests, so out/ipsw never holds the whole archive.
  PINNED_IPSW_URL: >-
    https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw

  # Xiaomi vendor archive. download-sheng-firmware.py pins this URL and MD5 and
  # extract-sheng-firmware.py refuses any other digest: change both together.
  SHENG_FIRMWARE_URL: >-
    https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.305.0.WNXMIXM/sheng_global_images_OS3.0.305.0.WNXMIXM_20260914.0000.00_16.0_global_31450b6677.tgz
  SHENG_FIRMWARE_MD5: 31450b6677d9e46edc4937c3f797c51d

  # UEFI extraction tool: release A76 ships one universal Mach-O (arm64 + x86_64)
  # at the archive root, which import-sheng-uefi.py drives as uefiextract.
  UEFITOOL_URL: >-
    https://github.com/LongSoft/UEFITool/releases/download/A76/UEFIExtract_NE_A76_universal_mac.zip
  UEFITOOL_SHA256: f3c5ca9402df3c14b28242dcd04b527791a12c1c0bf3c1cbbb3d1a0445168ec5

  # mainline DTS. fetch-sheng-dts.py pins the same commit.
  SHENG_DTS_REPOSITORY: ianchb/sm8550-mainline
  SHENG_DTS_COMMIT: 42f3b40c702abbc37c3a04c95af008cd283aeaf3

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 355
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      # The CLI resolves the device repository from this before -D is remembered.
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      UNIXNU_UEFI: ${{ github.workspace }}/device/uefi-sheng
      DEVICE_DIR: ${{ github.workspace }}/device
      UEFI_DIR: ${{ github.workspace }}/device/uefi-sheng
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.device_repository || format('{0}/UniXNU-sheng', github.repository_owner) }}
          ref: ${{ inputs.device_ref }}
          path: device
          submodules: recursive
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      # No recursive submodules: the firmware step initialises exactly the ones
      # board.toml [firmware] submodules names, into this checkout.
      - name: Check out the firmware
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.uefi_repository }}
          ref: ${{ inputs.uefi_ref }}
          path: device/uefi-sheng
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Check the runner before building
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          df -h "$GITHUB_WORKSPACE"
          [ -d "$DEVELOPER_DIR" ] || { echo "::error::Xcode not found at $DEVELOPER_DIR"; exit 1; }
          [ -f device/board.toml ] || { echo "::error::device repository has no board.toml"; exit 1; }
          [ -d "$UEFI_DIR/Platforms/Xiaomi/shengPkg" ] || { echo "::error::uefi-sheng has no shengPkg"; exit 1; }
          [ -f "$UEFI_DIR/Resources/Configs/sheng.toml" ] || { echo "::error::uefi-sheng has no sheng.toml"; exit 1; }
          xcodebuild -version
          # The vendor archive (~7 GiB) plus the XNU and EDK II trees need room.
          # The macos-26 image starts around 14 GiB free; quote the number for diagnosis.
          df -g "$GITHUB_WORKSPACE" | sed -n '2p'

      - name: Install host tools
        run: |
          set -euo pipefail
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          # scripts/qemu-entry/gdb-stop.py boots the candidate under qemu-system-aarch64
          # to read the metaclasses, so the emulator is a build dependency here.
          brew install qemu
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          for tool in clang ld.lld dtc fdtget fdtput mformat mcopy make qemu-system-aarch64; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing"; exit 1; }
          done

      # import-sheng-uefi.py drives build/tools/uefiextract/uefiextract on the vendor
      # UEFI image. A76 ships that binary as one universal Mach-O at the archive
      # root; the arm64 slice is the one macos-26 runs.
      - name: Install the UEFI extraction tool
        run: |
          set -euo pipefail
          curl -fsSL "$UEFITOOL_URL" -o "$RUNNER_TEMP/uefitool.zip"
          echo "$UEFITOOL_SHA256  $RUNNER_TEMP/uefitool.zip" | shasum -a 256 -c -
          python3 - "$RUNNER_TEMP/uefitool.zip" <<'PY'
          import os, struct, sys, zipfile
          from pathlib import Path

          dest = Path('device/build/tools/uefiextract')
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(sys.argv[1]) as archive:
              entries = [i for i in archive.infolist() if not i.is_dir()]
              print('archive holds:', ', '.join(e.filename for e in entries))
              exe = next((i for i in entries
                          if os.path.basename(i.filename).lower() == 'uefiextract'), None)
              if exe is None:
                  sys.exit('::error::this release no longer carries UEFIExtract at the archive root')
              data = archive.read(exe)
          if struct.unpack_from('>I', data)[0] != 0xCAFEBABE:
              sys.exit('::error::UEFIExtract is not a universal Mach-O')
          slices = struct.unpack_from('>I', data, 4)[0]
          kinds = {0x0100000C: 'arm64', 0x01000007: 'x86_64'}
          found = [kinds.get(struct.unpack_from('>I', data, 8 + i * 20)[0], 'other') for i in range(slices)]
          print('slices:', ', '.join(found))
          if 'arm64' not in found:
              sys.exit('::error::UEFIExtract has no arm64 slice for this runner')
          out = dest / 'uefiextract'
          out.write_bytes(data)
          out.chmod(0o755)
          print(f'installed {exe.filename}: {len(data)} bytes')
          PY
          file device/build/tools/uefiextract/uefiextract
          xattr -c device/build/tools/uefiextract/uefiextract 2>/dev/null || true
          echo '--- smoke test: a usage banner means the binary runs here ---'
          device/build/tools/uefiextract/uefiextract 2>&1 | head -5 || true

      # Reachability only; the tools below fetch what they need.
      - name: Check the pinned sources
        env:
          IPSW: ${{ inputs.ipsw_url || env.PINNED_IPSW_URL }}
        run: |
          set -euo pipefail
          echo "IPSW      $IPSW"
          curl -fsSL -o /dev/null -r 0-3 "$IPSW" && echo 'IPSW serves byte ranges'
          echo "firmware  $SHENG_FIRMWARE_URL"
          echo "firmware  MD5 $SHENG_FIRMWARE_MD5"
          curl -fsSI "$SHENG_FIRMWARE_URL" | tr -d '\r' | grep -Ei '^(accept-ranges|content-length):' || true
          echo "DTS       $SHENG_DTS_REPOSITORY@$SHENG_DTS_COMMIT"

      - name: Fetch the pinned sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu fetch -D "$DEVICE_DIR"

      - name: Select the device configuration
        id: select
        env:
          DEFCONFIG: sheng_defconfig
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser, cmd_defconfig
          from unixnu.config import Context
          ctx = Context(parser().parse_args(['defconfig', os.environ['DEFCONFIG']]))
          cmd_defconfig(ctx)
          name = ctx.board.get('board', {}).get('name')
          if not name:
              sys.exit('::error::board.toml needs [board] name')
          adt = ctx.board.get('payload', {}).get('adt', {})
          has_seed = bool(os.environ.get('UNIXNU_UNIQUE_CHIP_ID'))
          if adt.get('unique_chip_id') == 'required' and not has_seed:
              print('::warning::this board needs the platform seed for its payload', file=sys.stderr)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'board={name}\n')
              out.write(f'work={ctx.work}\n')
          print('board', name)
          print('work', ctx.work)
          PY

      # Xiaomi vendor archive: resumed on byte ranges, MD5-verified, then reduced
      # to the files the port consumes. --delete-archive keeps the runner free.
      - name: Download the vendor archive
        run: |
          set -euo pipefail
          python3 "$DEVICE_DIR/scripts/download-sheng-firmware.py"
          python3 "$DEVICE_DIR/scripts/extract-sheng-firmware.py" --delete-archive
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('device/.cache/firmware/sheng/porting-inputs.json')
          data = json.loads(manifest.read_text())
          assert data['gzip_integrity_verified'], 'gzip integrity was not verified'
          assert data['archive_md5'] == '31450b6677d9e46edc4937c3f797c51d', data['archive_md5']
          print(data['source_url'])
          print(f"{len(data['selected'])} inputs, {data['retained_bytes'] / 1024**2:.1f} MiB retained")
          for entry in data['selected']:
              print(f"  {entry['file']:<26} {entry['bytes'] / 1024**2:8.1f} MiB")
          assert any(e['file'].lower().startswith('uefi') for e in data['selected']), 'no uefi.elf'
          PY
          df -g "$GITHUB_WORKSPACE" | sed -n '2p'

      # Genuine vendor UEFI modules become EDK II INF wrappers under
      # device/uefi-sheng/Binaries/sheng; uefiplat.cfg lands in the cache.
      - name: Import the vendor UEFI modules
        run: python3 "$DEVICE_DIR/scripts/import-sheng-uefi.py"

      - name: Compile the board device tree
        run: |
          set -euo pipefail
          cd "$DEVICE_DIR"
          python3 scripts/fetch-sheng-dts.py
          ls -l build/sheng/sheng.dtb

      # The snapshot ESP carries UniXNU.efi, so the package comes before the kernel.
      - name: Build the UEFI package
        run: ./unixnu build package -D "$DEVICE_DIR"

      # sheng's kernel archives link against artifacts that only exist after the
      # storage ABI has been qualified on a running kernel: prepare-storage-headers.py
      # deliberately stops at the headers, and no script in the repositories writes
      # build/storage-abi/interface-audit.json. Supply those artifacts here.
      # Stage 1 of the two-phase build. audit-storage-interface.py needs a prelink
      # candidate, and the candidate needs the audit, so the loop has to be broken
      # with a kernel that links without it: sheng_bringup_defconfig turns off every
      # switch that reaches into the storage ABI, and the archives list is narrowed to
      # the builders that need no qualification. The candidate is only ever used to
      # take the QEMU snapshot.
      - name: Stage 1 - build the bring-up kernel
        env:
          WORK: ${{ steps.select.outputs.work }}
          # prepare-xnu-source.py lists Apple sources through the GitHub API;
          # anonymous calls from hosted runners hit the shared rate limit (403).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRINGUP="$DEVICE_DIR/configs/sheng_bringup_defconfig"
          if [ ! -f "$BRINGUP" ]; then
            echo "::error::device repository has no configs/sheng_bringup_defconfig"
            exit 1
          fi
          # stage 1 builds under its own work directory, named after the defconfig, so
          # the tree it compiles in is not the one WORK points at.
          BRINGUP_NAME="${BRINGUP##*/}"
          BRINGUP_NAME="${BRINGUP_NAME%_defconfig}"
          BRINGUP_WORK="$(dirname "$WORK")/$BRINGUP_NAME"
          echo "stage-1 work: $BRINGUP_WORK"
          # Expose the firmware checkout inside the stage-1 tree, as the full build does.
          mkdir -p "$BRINGUP_WORK/tree"
          ln -sfn "$UEFI_DIR" "$BRINGUP_WORK/tree/uefi-sheng"
          python3 - "$DEVICE_DIR/board.toml" <<'PY'
          import re
          import sys
          from pathlib import Path

          # Every component: entry stays: unixnu refuses a board whose [components]
          # include names no archive entry, and build-arm-driver.py needs no
          # qualification artifacts. Of the build-*.py builders only these five are
          # self-contained; the rest reach for a reference candidate or the storage
          # ABI audit, and their CONFIG switches are off in this configuration.
          keep_build = {
              'build-corecrypto-14.py',
              'build-corecrypto-14.py --namespace',
              'build-software-aes-bindings.py',
              'build-mockfs-fixture.py',
              'build-libpthread-kernel.py',
          }

          # Components whose builder needs a qualification artifact stage 1 cannot have,
          # or that do not compile under this configuration:
          #   Adreno740  NativeAdrenoService.cpp declares ring/fence/SQE locals nothing
          #              reads yet and build-arm-driver.py passes -Werror
          #   ShengHidInput, AppleKeyStoreState  build-sheng-hid-input.py and its peers
          #              stop with "No reference candidate available"
          # Stage 1 needs none of them: it only has to reach IOKit initialisation.
          #   ShengUfs  derives from the original IOBlockStorageDevice (only the prelink
          #             step supplies it) and references _boot_progress_poll plus the
          #             VerifiedRoot entry points, so it cannot link into this kernel
          # Stage 1 needs none of them: it only has to reach IOKit initialisation.
          drop_components = {'Adreno740', 'AdrenoMetal', 'AirNir',
                             'ShengHidInput', 'AppleKeyStoreState', 'ShengUfs'}

          def keep(value):
              if value.startswith('component:'):
                  return value.split(':', 1)[1] not in drop_components
              return not value.startswith('build-') or value in keep_build
          path = Path(sys.argv[1])
          source = path.read_text()
          path.with_suffix('.toml.full').write_text(source)
          out, inside, dropped = [], False, []
          for line in source.splitlines():
              text = line.strip()
              if text.startswith('"archives"'):
                  inside = True
                  out.append(line)
                  continue
              if inside:
                  if text.startswith(']'):
                      inside = False
                      out.append(line)
                      continue
                  value = text.rstrip(',').strip('"')
                  if keep(value):
                      out.append(line)
                  else:
                      dropped.append(value)
                  continue
              out.append(line)
          text = '\n'.join(out) + '\n'
          # [components] include has to match the archives list, so the same names leave it.
          match = re.search(r'"include"\s*=\s*\[(.*?)\]', text, re.S)
          if match:
              names = [item.strip().strip('"') for item in match.group(1).split(',') if item.strip()]
              kept_names = [name for name in names if name not in drop_components]
              text = (text[:match.start()] + '"include" = [' +
                      ', '.join(f'"{name}"' for name in kept_names) + ']' + text[match.end():])
              print('components kept:', ', '.join(kept_names))
          text = text.replace('"defconfig" = "sheng_defconfig"', '"defconfig" = "sheng_bringup_defconfig"')
          path.write_text(text)
          print(f'archives dropped {len(dropped)}:')
          for value in dropped:
              print(f'  - {value}')
          PY
          ./unixnu defconfig sheng_bringup_defconfig -D "$DEVICE_DIR"
          ./unixnu build kernel -D "$DEVICE_DIR" --ipsw "${IPSW:-$PINNED_IPSW_URL}"
          report=$(ls "$BRINGUP_WORK"/kernel/*.json 2>/dev/null | head -1 || true)
          if [ -z "$report" ]; then
            echo '::error::the prelink step wrote no report next to kernel.macho'
            exit 1
          fi
          # Two trees need the candidate: the generator reads the stage-1 tree (that is
          # where the compile records live), and the audit later reads the stage-2 tree.
          for dest in "$BRINGUP_WORK/tree" "$WORK/tree"; do
            mkdir -p "$dest/build/xnu-prelink"
            cp "$BRINGUP_WORK/kernel/kernel.macho" "$dest/build/xnu-prelink/native-apfs-load-positive.macho"
            cp "$report" "$dest/build/xnu-prelink/native-apfs-load-positive.json"
          done
          echo "candidate report: $report"
          ls -l "$BRINGUP_WORK/tree/build/xnu-prelink/" "$WORK/tree/build/xnu-prelink/"
          # Restore the full board file so the stage-2 kernel uses sheng_defconfig.
          mv "$DEVICE_DIR/board.toml.full" "$DEVICE_DIR/board.toml"

      - name: Inject the qualification snapshot
        id: snapshot
        env:
          SNAPSHOT: ${{ inputs.snapshot_url }}
          WORK: ${{ steps.select.outputs.work }}
        run: |
          set -euo pipefail
          TREE="$WORK/tree"
          if [ -n "$SNAPSHOT" ]; then
            echo "::add-mask::$SNAPSHOT"
            curl -fsSL --retry 3 "$SNAPSHOT" -o "$RUNNER_TEMP/snapshot.zip"
            python3 - "$RUNNER_TEMP/snapshot.zip" "$TREE" <<'PY'
          import sys, zipfile
          from pathlib import Path
          archive, tree = sys.argv[1], Path(sys.argv[2])
          root = tree / 'build'
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  if name.endswith('/'):
                      continue
                  parts = Path(name).parts
                  if '..' in parts or name.startswith('/'):
                      sys.exit(f'::error::unsafe path in the snapshot: {name}')
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
                  print(f'injected {name}: {target.stat().st_size} bytes')
          PY
          fi


      # audit-storage-interface.py consumes a QEMU/GDB snapshot that no repository
      # script writes; make-storage-snapshot.py produces it by reusing the audit's
      # own metaclass derivation. It needs a prelink candidate, so it only runs when
      # one is already present in the tree.
      - name: Generate the qualification snapshot
        env:
          WORK: ${{ steps.select.outputs.work }}
        run: |
          set -euo pipefail
          # The audit derivation needs the stage-1 tree: that is where the XNU compile
          # records (IOPlatformExpert.cpo.json) and the .cache/xnu-work directory the
          # reference object is built in both live. Stage 2 has produced neither yet.
          BRINGUP_TREE="$(dirname "$WORK")/sheng_bringup/tree"
          if [ ! -f "$BRINGUP_TREE/build/xnu-prelink/native-apfs-load-positive.macho" ]; then
            echo '::warning::no native-apfs-load-positive prelink candidate; the generator needs one'
            exit 0
          fi
          if [ ! -f "$BRINGUP_TREE/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/IOPlatformExpert.cpo.json" ]; then
            echo "::error::stage-1 produced no IOPlatformExpert compile record in $BRINGUP_TREE"
            exit 1
          fi
          # The snapshot ESP needs UniXNU.efi, which the package step wrote under WORK.
          ln -sfn "$WORK/package" "$(dirname "$BRINGUP_TREE")/package"
          # DarwinBoot.efi comes from the EDK II build that scripts/build-darwinboot.sh
          # runs. Its toolchain search stops at $ROOT/../toolchain and $ROOT/.cache/
          # toolchain, but the toolchain belongs to the stage-2 work directory (the
          # package step created it there), so point CLANG_BIN at it directly.
          # EDK II treats CLANG_BIN as a directory prefix and appends tool names without a
          # separator, which is why build-darwinboot.sh defaults to a trailing slash.
          # Without it the compiler path becomes .../toolchainclang.
          export CLANG_BIN="$WORK/toolchain/"
          if [ ! -x "${CLANG_BIN%/}/clang" ]; then
            echo "::error::no clang under ${CLANG_BIN%/}; the package step should have created it"
            exit 1
          fi
          echo "CLANG_BIN=$CLANG_BIN"
          # tee the generator output into the logs directory so a failure is also
          # visible in the uploaded artifact, not only in the live job console.
          mkdir -p "$WORK/logs"
          python3 "$GITHUB_WORKSPACE/.github/scripts/make-storage-snapshot.py" --root "$BRINGUP_TREE" 2>&1 \
            | tee "$WORK/logs/snapshot.log"
          # Hand the result to the stage-2 tree, where the audit will look for it.
          mkdir -p "$WORK/tree/build"
          rm -rf "$WORK/tree/build/darwinboot-storage-native-metadata"
          cp -R "$BRINGUP_TREE/build/darwinboot-storage-native-metadata" "$WORK/tree/build/"
          ls -l "$WORK/tree/build/darwinboot-storage-native-metadata/"

      # Checked only after both the injected archive and the generator have run.
      - name: Verify the qualification snapshot
        env:
          ALLOW_MISSING: ${{ inputs.allow_missing_snapshot }}
          WORK: ${{ steps.select.outputs.work }}
        run: |
          set -euo pipefail
          TREE="$WORK/tree"
          python3 - "$TREE" <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path(sys.argv[1]) / 'build'
          required = {
              'storage ABI audit': 'storage-abi/interface-audit.json',
              'live storage metadata': 'darwinboot-storage-native-metadata/gdb-stop.json',
              'AES interface audit': 'image4-ignition/aes-interface-audit.json',
              'verified root archive': 'verified-root-os-xnu-bundle/libVerifiedRootProbe.a',
          }
          missing = {k: v for k, v in required.items() if not (root / v).is_file()}
          allow = os.environ.get('ALLOW_MISSING', 'false').lower() == 'true'
          if missing:
              print('missing qualification artifacts:')
              for name, rel in missing.items():
                  print(f'  {name:<24} build/{rel}')
              if allow:
                  print('::warning::continuing without them; the kernel archives will fail at link')
              else:
                  sys.exit('::error::supply snapshot_url with these files, or set allow_missing_snapshot')
          else:
              print('all qualification artifacts present')
              for name, rel in required.items():
                  print(f'  {name:<24} build/{rel}')
          PY
      - name: Build the kernel
        env:
          IPSW: ${{ inputs.ipsw_url || env.PINNED_IPSW_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu build kernel -D "$DEVICE_DIR" --ipsw "$IPSW"

      # check-sheng.py resolves uefi-sheng and the compiled DTB relative to the
      # tree, so expose both there before the firmware step runs it.
      - name: Stage the preflight inputs
        env:
          WORK: ${{ steps.select.outputs.work }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/tree/build/sheng"
          cp "$DEVICE_DIR/build/sheng/sheng.dtb" "$WORK/tree/build/sheng/sheng.dtb"
          ln -sfn "$UEFI_DIR" "$WORK/tree/uefi-sheng"
          ls -l "$WORK/tree/uefi-sheng" "$WORK/tree/build/sheng/sheng.dtb"

      - name: Build the firmware
        env:
          SKIP_PREFLIGHT: ${{ inputs.skip_preflight }}
        run: |
          set -euo pipefail
          args=(--device "$DEVICE_DIR" --uefi "$UEFI_DIR")
          if [ "$SKIP_PREFLIGHT" = "true" ] || [ "$SKIP_PREFLIGHT" = "True" ]; then
            args+=(--skip-preflight)
          fi
          ./unixnu build firmware "${args[@]}"

      # The two original Apple trust modules come straight out of the target IPSW:
      # StaticTrustCache and Cryptex1,SystemTrustCache. DarwinBoot refuses a bundle
      # whose hashes are not ascending and whose modules are not version 2, so the
      # result is checked against the digests build-original-system-trust.py pins.
      - name: Build the original trust bundle
        id: trust
        env:
          IPSW: ${{ inputs.ipsw_url || env.PINNED_IPSW_URL }}
        run: |
          set -euo pipefail
          mkdir -p device/build/original-trust
          python3 - <<'PY'
          import hashlib, json, os, plistlib, struct, sys, zipfile
          sys.path.insert(0, 'scripts')
          from unixnu.ipsw import RangeFile, im4p_payload

          STATIC_SHA = 'da88460e6e513438d5307e5c526f76497a74754476a24da29f239f0c90120fc2'
          SYSTEM_SHA = 'd121ba89167e03aafd00fa687c30cd8ebc4ccafd10c1408adb2ba3de12403651'
          BUNDLE_SHA = '7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7'

          url = os.environ['IPSW']
          with zipfile.ZipFile(RangeFile(url)) as archive:
              manifest = plistlib.loads(archive.read('BuildManifest.plist'))
              if (manifest['ProductVersion'], manifest['ProductBuildVersion']) != ('17.7.11', '21H461'):
                  sys.exit(f"::error::IPSW is {manifest['ProductVersion']} {manifest['ProductBuildVersion']}, the board needs 17.7.11 21H461")
              identity = next((i for i in manifest['BuildIdentities']
                               if i['Info']['DeviceClass'] == 'j120ap' and i['Info']['RestoreBehavior'] == 'Erase'), None)
              if identity is None:
                  sys.exit('::error::this IPSW has no j120ap Erase identity')
              members = {kind: identity['Manifest'][kind]['Info']['Path']
                         for kind in ('StaticTrustCache', 'Cryptex1,SystemTrustCache')}
              blobs = {kind: archive.read(path) for kind, path in members.items()}

          def candidates(data):
              """The member as stored, then its IM4P payload: the IPSW wraps some of these."""
              out = [('raw', data)]
              try:
                  out.append(('im4p', im4p_payload(data)))
              except Exception:
                  pass
              return out

          def pick(kind, expected):
              tried = []
              for label, blob in candidates(blobs[kind]):
                  digest = hashlib.sha256(blob).hexdigest()
                  tried.append(f'{label}={digest}')
                  if digest == expected and struct.unpack_from('<I', blob)[0] == 2:
                      return blob
              sys.exit(f'::error::{kind} does not match the pinned module ({", ".join(tried)}); '
                       f'the IPSW build or the pin is different')

          static = pick('StaticTrustCache', STATIC_SHA)
          system = pick('Cryptex1,SystemTrustCache', SYSTEM_SHA)
          for name, module in (('static', static), ('system', system)):
              count = struct.unpack_from('<I', module, 20)[0]
              if len(module) != 24 + count * 24:
                  sys.exit(f'::error::the {name} module is not a complete version-2 module')

          bundle = struct.pack('<3I', 2, 12, 12 + len(static)) + static + system
          digest = hashlib.sha256(bundle).hexdigest()
          if digest != BUNDLE_SHA:
              sys.exit(f'::error::bundle is {digest}, expected {BUNDLE_SHA}')

          out = 'device/build/original-trust'
          open(f'{out}/trust.bundle', 'wb').write(bundle)
          report = dict(bundle_sha256=digest,
                        static=dict(member=members['StaticTrustCache'], sha256=STATIC_SHA),
                        system=dict(member=members['Cryptex1,SystemTrustCache'], sha256=SYSTEM_SHA),
                        own_code_entries_added=False, gpu_plugin_included=False)
          open(f'{out}/trust.json', 'w').write(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          print(f'trust bundle {len(bundle)} bytes')
          PY

      - name: Prepare payload inputs
        if: inputs.trust_cache_url != '' || inputs.data_seed_url != ''
        run: |
          set -euo pipefail
          trust=$(jq -r '.inputs.trust_cache_url // ""' "$GITHUB_EVENT_PATH")
          seed=$(jq -r '.inputs.data_seed_url // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$trust" ]; then echo "::add-mask::$trust"; curl -fsSL --retry 3 "$trust" -o "$RUNNER_TEMP/trustcache"; fi
          if [ -n "$seed" ]; then echo "::add-mask::$seed"; curl -fsSL --retry 3 "$seed" -o "$RUNNER_TEMP/data.dbr"; fi

      - name: Build the payload
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
          OWNER_TRUST_CACHE: ${{ inputs.owner_trust_cache }}
        run: |
          set -euo pipefail
          if [ -z "${UNIXNU_UNIQUE_CHIP_ID:-}" ]; then
            echo '::error::board.toml marks the platform seed required: set the UNIXNU_UNIQUE_CHIP_ID secret'
            exit 1
          fi
          args=(--device "$DEVICE_DIR" --uefi "$UEFI_DIR")
          if [ -f "$RUNNER_TEMP/trustcache" ]; then
            if [ "$OWNER_TRUST_CACHE" = "true" ] || [ "$OWNER_TRUST_CACHE" = "True" ]; then
              args+=(--owner-trust-cache "$RUNNER_TEMP/trustcache")
            else
              args+=(--trust-cache "$RUNNER_TEMP/trustcache")
            fi
            echo 'trust cache: the supplied bundle'
          elif [ -f "$DEVICE_DIR/build/original-trust/trust.bundle" ]; then
            args+=(--trust-cache "$DEVICE_DIR/build/original-trust/trust.bundle")
            echo 'trust cache: the two original Apple modules from the IPSW (no GPU plugin)'
          else
            echo '::warning::no trust cache: the image builds but AMFI will refuse the original kexts'
          fi
          if [ -f "$RUNNER_TEMP/data.dbr" ]; then args+=(--data-ramdisk "$RUNNER_TEMP/data.dbr"); fi
          if [ "$SKIP_SETUP" = "true" ] || [ "$SKIP_SETUP" = "True" ]; then args+=(--skip-setup); fi
          ./unixnu build payload "${args[@]}"

      # BootShim + firmware volume, gzipped, with the mainline DTB appended and
      # the payload as ramdisk. board.toml [[bootimg.dtb_node]] adds splash_region,
      # which stock ABL needs before it hands the panel over.
      - name: Pack the boot image
        env:
          UNIXNU_DTB: ${{ github.workspace }}/device/build/sheng/sheng.dtb
        run: |
          set -euo pipefail
          ./unixnu bootimg -D "$DEVICE_DIR" --uefi "$UEFI_DIR" \
            --dtb "$DEVICE_DIR/build/sheng/sheng.dtb"

      - name: Report the artifacts
        env:
          WORK: ${{ steps.select.outputs.work }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          work = Path(os.environ['WORK'])
          for rel in ('boot/boot.json', 'payload/payload.json'):
              path = work / rel
              print(f'--- {rel}')
              print(path.read_text() if path.is_file() else 'missing')
          for img in sorted((work / 'boot').glob('*.img')):
              print(f"{img.name}: {img.stat().st_size} bytes  sha256 {hashlib.sha256(img.read_bytes()).hexdigest()}")
          PY
          df -g "$GITHUB_WORKSPACE" | sed -n '2p'

      - name: Upload the boot image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sheng-boot-${{ github.run_attempt }}
          path: |
            ${{ steps.select.outputs.work }}/boot/boot.img
            ${{ steps.select.outputs.work }}/boot/boot.json
            ${{ steps.select.outputs.work }}/payload/payload.img
            ${{ steps.select.outputs.work }}/payload/payload.json
            ${{ steps.select.outputs.work }}/kernel/kernel.macho
          if-no-files-found: error
          retention-days: 14

      - name: Upload the firmware volume
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sheng-firmware-${{ github.run_attempt }}
          path: device/uefi-sheng/Build/shengPkg/*_CLANGPDB/FV/*.fd
          if-no-files-found: error
          retention-days: 14

      - name: Stage the text logs
        if: always() && steps.select.outcome == 'success'
        env:
          WORK: ${{ steps.select.outputs.work }}
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, shutil
          from pathlib import Path
          work = Path(os.environ['WORK'])
          # Stage 1 builds under its own sibling directory (sheng_bringup), so every
          # work directory of this configuration contributes logs, not only WORK.
          sources = [work / 'logs'] + sorted(p for p in work.parent.glob('*/logs') if p != work / 'logs')
          target = Path(os.environ['RUNNER_TEMP']) / 'public-logs'
          shutil.rmtree(target, ignore_errors=True)
          target.mkdir(parents=True)
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          inputs = event.get('inputs', {}) or {}
          secrets = [os.environ.get('UNIXNU_UNIQUE_CHIP_ID', ''),
                     inputs.get('trust_cache_url', ''),
                     inputs.get('data_seed_url', '')]
          secrets = [value for value in secrets if value]
          count = 0
          for source in sources:
              if not source.is_dir():
                  continue
              prefix = '' if source.parent == work else source.parent.name + '-'
              for path in sorted(source.glob('*.log')):
                  data = path.read_bytes()
                  if b'\0' in data:
                      continue
                  text = data.decode('utf-8', 'replace')
                  for value in secrets:
                      text = text.replace(value, '***')
                  text = re.sub(r'https?://[^\s"\']*[?&](?:token|sig|signature|key|X-Amz-Signature)=[^\s"\']*', '***', text, flags=re.I)
                  (target / (prefix + path.name)).write_text(text)
                  count += 1
                  print(f'  {prefix + path.name}: {len(text)} bytes')
          print(f'{count} text logs staged from {len(sources)} work directories')
          PY

      - name: Upload the logs
        if: always() && steps.select.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sheng-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish the release
        if: inputs.publish_release == true && success()
        env:
          GH_TOKEN: ${{ github.token }}
          WORK: ${{ steps.select.outputs.work }}
        run: |
          set -euo pipefail
          tag="sheng-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" \
            "$WORK/boot/boot.img#boot.img" \
            "$WORK/payload/payload.img#payload.img" \
            --title "sheng boot image $tag" \
            --notes "UniXNU ${GITHUB_SHA}. Flash with: fastboot flash boot_b boot.img && fastboot set_active b"

      - name: Summary
        if: always()
        env:
          WORK: ${{ steps.select.outputs.work }}
          PREFLIGHT: ${{ inputs.skip_preflight }}
        run: |
          set -euo pipefail
          {
            echo "## sheng boot image"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| device | \`${{ inputs.device_repository || 'fork UniXNU-sheng' }}\` @ \`${{ inputs.device_ref }}\` |"
            echo "| firmware | \`${{ inputs.uefi_repository }}\` @ \`${{ inputs.uefi_ref }}\` |"
            echo "| UniXNU | \`${GITHUB_SHA}\` |"
            echo "| Xcode | ${{ inputs.xcode }} |"
            echo "| preflight | ${PREFLIGHT:-false} |"
            echo
            echo 'First test, nothing written: `fastboot boot boot.img`'
            echo
            echo 'Flash to the spare slot: `fastboot flash boot_b boot.img && fastboot set_active b` (slot a keeps the way back)'
            echo
            if [ -f "$WORK/boot/boot.json" ]; then
              echo '```json'
              cat "$WORK/boot/boot.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Scrub the Apple and Xiaomi inputs: they must not stay on a hosted runner.
      - name: Remove proprietary inputs
        if: always()
        run: |
          rm -rf out/ipsw out/feeds device/.cache/firmware/sheng \
                 out/*/tree/.cache/firmware out/*/payload/data-skip-setup-* \
                 out/*/*/*/tree/.cache/firmware out/*/*/*/payload/data-skip-setup-*
          rm -f "$RUNNER_TEMP/trustcache" "$RUNNER_TEMP/data.dbr" "$RUNNER_TEMP/data-grow.dbr" "$RUNNER_TEMP/uefitool.zip"
          rm -rf "$RUNNER_TEMP/uefitool"
          df -g "$GITHUB_WORKSPACE" | sed -n '2p'