version: 2.1

# Minimal probe. This job does ONE thing: report whether the macOS VM can start
# QEMU with HVF, which is the single input a GitHub-hosted runner cannot supply
# (QEMU reports HV_UNSUPPORTED there; actions/runner-images#13505). Cost is a few
# credits, so run this before committing to a full build on the 1-hour free-plan
# job limit.
jobs:
  hvf-probe:
    macos:
      xcode: "26.6"          # same Xcode line the build is developed with
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Host identity
          command: |
            sw_vers
            uname -m
            sysctl -n hw.ncpu
            sysctl -n machdep.cpu.brand_string || true
            echo "--- hypervisor support ---"
            sysctl kern.hv_support || echo "kern.hv_support missing"
            sysctl kern.hv_vmm_present || echo "kern.hv_vmm_present missing"
      - run:
          name: Install QEMU
          command: |
            HOMEBREW_NO_AUTO_UPDATE=1 brew install qemu
            qemu-system-aarch64 --version
      - run:
          name: Can QEMU start with HVF?
          command: |
            set +e
            # Same machine definition the native-4K observation uses.
            timeout 20 qemu-system-aarch64 \
              -M virt,virtualization=off,secure=off,gic-version=3 \
              -accel hvf -cpu host -m 1024 -smp 1 \
              -display none -monitor none -serial none -S
            rc=$?
            echo "qemu exit code: $rc"
            if [ $rc -eq 124 ]; then
              echo "RESULT: HVF WORKS (QEMU stayed up until the timeout)"
            else
              echo "RESULT: HVF REFUSED (exit $rc) -- read the message above"
            fi
      - run:
          name: Firmware the observation needs
          command: |
            QEMU_PREFIX=$(brew --prefix qemu)
            ls -l "$QEMU_PREFIX/share/qemu/edk2-aarch64-code.fd" || echo "missing code FD"
            # -M virt wants a 64 MiB pflash image; a 3 MiB one fails with
            # "cfi.pflash01 requires 67108864 bytes, provides 3145728".
            stat -f%z "$QEMU_PREFIX/share/qemu/edk2-aarch64-code.fd" 2>/dev/null || true

workflows:
  probe:
    jobs:
      - hvf-probe
